<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Flujo de partículas</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #0a0a0a;
    touch-action: none; /* evita scroll y zoom al tocar la pantalla */
  }

  canvas { display: block; }

  .watermark {
    position: absolute;
    left: 50%;
    bottom: 3.2%;
    transform: translateX(-50%);
    color: rgba(255, 255, 255, 0.28);
    font-size: clamp(12px, 1.9vh, 36px);
    letter-spacing: 0.04em;
    pointer-events: none;
    user-select: none;
    white-space: nowrap;
    z-index: 10;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
</style>
</head>
<body>
  <div class="watermark">@Captura_Casual | 2026</div>

  <script>
    let particles = [];
    let lastRestart = 0;

    function setup() {
      createCanvas(windowWidth, windowHeight);
      startArt();
    }

    // Reinicia el dibujo desde cero con una nueva semilla de ruido.
    function startArt() {
      noiseSeed(floor(random(100000)));
      background(10);
      particles = [];

      // La cantidad de partículas depende del área para mantener la densidad en cualquier pantalla.
      let count = constrain(floor((width * height) / 1200), 300, 2000);
      for (let i = 0; i < count; i++) {
        particles.push(createVector(random(width), random(height)));
      }
    }

    function draw() {
      stroke(255, 15);
      for (let p of particles) {
        // noise() da movimiento orgánico; random() daría caos puro
        let angle = noise(p.x * 0.003, p.y * 0.003) * TWO_PI * 4;
        let step = p5.Vector.fromAngle(angle).mult(2);
        line(p.x, p.y, p.x + step.x, p.y + step.y);
        p.add(step);

        if (p.x < 0 || p.x > width || p.y < 0 || p.y > height) {
          p.x = random(width);
          p.y = random(height);
        }
      }
    }

    function restart() {
      // Evita que un mismo toque dispare dos reinicios seguidos.
      let now = millis();
      if (now - lastRestart < 250) return;
      lastRestart = now;
      startArt();
    }

    function mousePressed() {
      restart();
    }

    function touchStarted() {
      restart();
      return false; // evita el comportamiento por defecto del navegador
    }

    function windowResized() {
      let oldW = width;
      let oldH = height;

      resizeCanvas(windowWidth, windowHeight);

      // Reubica las partículas existentes para conservar la composición al cambiar de tamaño.
      let sx = oldW > 0 ? width / oldW : 1;
      let sy = oldH > 0 ? height / oldH : 1;
      for (let p of particles) {
        p.x *= sx;
        p.y *= sy;
      }

      background(10);
    }
  </script>
</body>
</html>
